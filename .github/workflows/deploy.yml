name: Import phrases and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: dictionary-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Import Unicode text files
        run: node scripts/import-phrases.mjs
      - name: Save updated dictionary
        run: |
          if ! git diff --quiet -- phrases.json text-files.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add phrases.json text-files.json
            git commit -m "Update phrases from text imports"
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - name: Prepare website
        run: |
          mkdir -p _site
          cp index.html style.css script.js phrases.json text-files.json _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
